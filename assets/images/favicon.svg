<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="4" fill="#0E7C86"/>

  <!-- faint background: remaining 3x3 lattice edges not in the tree -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="8"    y1="8"    x2="11.5" y2="8"/>
    <line x1="4.5"  y1="11.5" x2="8"    y2="11.5"/>
    <line x1="8"    y1="4.5"  x2="8"    y2="8"/>
    <line x1="11.5" y1="8"    x2="11.5" y2="11.5"/>
  </g>

  <!-- bold: spanning tree (H-shape) -->
  <g stroke="#ffffff" stroke-width="0.95" opacity="0.95">
    <line x1="4.5"  y1="4.5"  x2="4.5"  y2="8"/>
    <line x1="4.5"  y1="8"    x2="4.5"  y2="11.5"/>
    <line x1="11.5" y1="4.5"  x2="11.5" y2="8"/>
    <line x1="4.5"  y1="8"    x2="8"    y2="8"/>
    <line x1="4.5"  y1="4.5"  x2="8"    y2="4.5"/>
    <line x1="11.5" y1="11.5" x2="8"    y2="11.5"/>
    <line x1="8"    y1="8"    x2="8"    y2="11.5"/>
    <line x1="8"    y1="4.5"  x2="11.5" y2="4.5"/>
  </g>

  <g fill="#ffffff">
    <circle cx="4.5"  cy="4.5"  r="1"/>
    <circle cx="8"    cy="4.5"  r="1"/>
    <circle cx="11.5" cy="4.5"  r="1"/>
    <circle cx="4.5"  cy="8"    r="1.25"/>
    <circle cx="8"    cy="8"    r="1"/>
    <circle cx="11.5" cy="8"    r="1"/>
    <circle cx="4.5"  cy="11.5" r="1"/>
    <circle cx="8"    cy="11.5" r="1"/>
    <circle cx="11.5" cy="11.5" r="1"/>
  </g>
</svg>
